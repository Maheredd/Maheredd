<rect x="24" y="24" width="390" height="252" rx="12" fill="#161b22" stroke="#30363d"/><text x="44" y="54" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#ff7ab8" letter-spacing="1">WHAT I BUILD</text><text x="44" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#3fb950">10K+</text><text x="44" y="122" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8b949e">logs per day</text><text x="150" y="96" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3">AI-driven cloud security monitoring</text><text x="150" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">with real-time anomaly detection</text><line x1="44" y1="130" x2="394" y2="130" stroke="#30363d"/><text x="44" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#bc8cff">90%+</text><text x="44" y="190" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8b949e">accuracy</text><text x="150" y="164" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3">CNN-based computer vision system</text><text x="150" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">for image classification</text><line x1="44" y1="198" x2="394" y2="198" stroke="#30363d"/><text x="44" y="240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f778ba">15+</text><text x="44" y="258" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8b949e">bugs resolved</text><text x="150" y="232" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3">Client-facing features shipped during</text><text x="150" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">a web development internship</text><rect x="434" y="24" width="372" height="252" rx="12" fill="#161b22" stroke="#30363d"/><text x="454" y="54" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#ff7ab8" letter-spacing="1">CURRENTLY LEARNING</text><rect x="454" y="70" width="82" height="4" rx="2" fill="#30363d"/><rect class="sg0" x="454" y="70" width="0" height="4" rx="2" fill="#58a6ff"/><rect x="542" y="70" width="82" height="4" rx="2" fill="#30363d"/><rect class="sg1" x="542" y="70" width="0" height="4" rx="2" fill="#58a6ff"/><rect x="630" y="70" width="82" height="4" rx="2" fill="#30363d"/><rect class="sg2" x="630" y="70" width="0" height="4" rx="2" fill="#58a6ff"/><rect x="718" y="70" width="82" height="4" rx="2" fill="#30363d"/><rect class="sg3" x="718" y="70" width="0" height="4" rx="2" fill="#58a6ff"/><g class="sl0"><text x="454" y="150" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="40" fill="#58a6ff" opacity=".5">01</text><text x="454" y="192" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Modern web technologies</text><text x="454" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">React, Vite, and the wider</text><text x="454" y="242" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">front-end ecosystem.</text></g><g class="sl1"><text x="454" y="150" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="40" fill="#58a6ff" opacity=".5">02</text><text x="454" y="192" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Backend architecture</text><text x="454" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Designing reliable services</text><text x="454" y="242" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">with Flask and Express.</text></g><g class="sl2"><text x="454" y="150" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="40" fill="#58a6ff" opacity=".5">03</text><text x="454" y="192" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Authentication mechanisms</text><text x="454" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Sessions, tokens, and secure</text><text x="454" y="242" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">login flows.</text></g><g class="sl3"><text x="454" y="150" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="40" fill="#58a6ff" opacity=".5">04</text><text x="454" y="192" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Machine learning concepts</text><text x="454" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">CNNs, anomaly detection, and</text><text x="454" y="242" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">AI-driven product features.</text></g>
